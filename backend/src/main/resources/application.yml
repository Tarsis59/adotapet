spring:
  application:
    name: adotapet-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/adotapet}
    username: ${DB_USERNAME:adotapet}
    password: ${DB_PASSWORD:adotapet}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080
  # Navegadores de desenvolvimento acumulam muitos cookies em "localhost"; o padrão de 8 KB do Tomcat
  # recusaria a requisição com 400 antes de chegar à aplicação.
  max-http-request-header-size: 64KB

adotapet:
  jwt:
    secret: ${JWT_SECRET:AdotaPet-Chave-Secreta-De-Desenvolvimento-Nao-Usar-Em-Producao-2026}
    expiracao: PT2H
  cors:
    origem-permitida: ${CORS_ORIGEM:http://localhost:4200}
