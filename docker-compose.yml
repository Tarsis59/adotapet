services:
  postgres:
    image: postgres:17-alpine
    container_name: adotapet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adotapet
      POSTGRES_USER: adotapet
      POSTGRES_PASSWORD: adotapet
    ports:
      - "5432:5432"
    volumes:
      - adotapet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adotapet -d adotapet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  adotapet-pgdata:
